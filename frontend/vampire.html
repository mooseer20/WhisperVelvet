    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VelvetWhispers - Sign In</title>
        <link rel="stylesheet" href="css/vampire.css">
        <link rel="icon" type="image/png"
        href="assets/images/VW.png">
        <link rel="icon" type="image/png"
        href="assets/images/VW4.png">

        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    </head>
    <body class="login-body">

        <div class="background-overlay"></div>
        <div class="background-image">
            
        </div>

        <header class="login-header">
        <h1 class ="logo-text"> Velvet Whispers </h1>
        </header>

        <main class="login-container">
            <form class="login-form">
                <h2>Sign In</h2>

                <div class="input-group">
                    <input type="text" id="email" placeholder="Email or phone number" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>


                <button type="submit" class="sign-in-button">
                    Sign In</button>

                <div class="form-help">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="help.html" class="need-help">Need help?</a>
                </div>

                <div class="signup-link">
                    New to VelvetWhisp? <a href="sign-up.html">Sign up now.</a>
                </div>

            </form>
        </main>

        <footer class="login-footer">
            <div class = " footer-content" >
                <p> Questions ?  Call <a href="tel:+374-410-474-71 "
                    class ="footer-link "> 374-410-474-71</a></p>
                    <div class="footer-links-grid">
                        
                        <a href="faq.html" class="footer-link">FAQ</a>
                        <a href="help.html" class="footer-link">Help Centre</a>
                        <a href="term.html" class="footer-link">Terms of Use</a>
                        <a href="privacy.html" class="footer-link">Privacy</a>
                        <a href="copr.html" class="footer-link">Cookie Preferences</a>
                        <a href="coin.html" class="footer-link">Corporate Information</a>
                    </div>
        </footer>

        <script type="module">
          import { initLoginForm } from "./js/auth.js";
          initLoginForm();
        </script>
    </body>
    </html>
