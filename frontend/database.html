<!-- ================= PAGE MODE SWITCH ================= -->
<script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");
const IS_DETAIL_PAGE = !!title;

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("movie-detail").style.display =
    IS_DETAIL_PAGE ? "block" : "none";

  document.getElementById("home-sections").style.display =
    IS_DETAIL_PAGE ? "none" : "block";

  if (!IS_DETAIL_PAGE) renderSections();
});
</script>

<!-- ================= HOME DATA (UNTOUCHED LISTS) ================= -->
<script>
function movie(img, imdb, title) {
  const src = (typeof assetUrl === "function") ? assetUrl(img) : img;
  return { img: src, imdb, title };
}

const sections = [
  {
    id: "section-main-stream",
    movies: [
      movie("twlight.jpeg","5.2","Twilight"),
      movie("leg.jpeg","7.3","Legacies"),
      movie("vamp.jpeg","7.7","The Vampire Diaries"),
      movie("originals.jpeg","8.2","The Originals")
    ]
  },
  {
    id: "section-trending",
    movies: [
      movie("nos.jpeg","8.0","Nosferatu"),
      movie("tala.jpeg","7.1","Thale"),
      movie("drac.jpeg","7.4","Dracula"),
      movie("priest.jpeg","5.7","Priest"),
      movie("fromdusk.jpeg","7.2","From Dusk Till Dawn"),
      movie("morb.jpeg","5.1","Morbius"),
      movie("leg2.jpeg","7.3","Legacies"),
      movie("teenw.jpeg","7.7","Teen Wolf"),
      movie("underwo.jpeg","7.0","Underworld"),
      movie("zomb.jpeg","6.8","Zombies"),
      movie("nightt.jpeg","7.6","Night Teeth"),
      movie("luc.jpeg","8.2","Lucifer")
    ]
  },
  {
    id: "section-popular",
    movies: [
      movie("dracdrac.jpeg","8.5","Dracula"),
      movie("castl.jpeg","8.2","Castlevania"),
      movie("hem.jpeg","7.1","Hemlock Grove"),
      movie("tb.jpeg","7.9","True Blood"),
      movie("sh.jpeg","6.7","Shadowhunters"),
      movie("vh.jpeg","6.9","Van Helsing"),
      movie("firsrtkill.jpeg","6.6","First Kill"),
      movie("fate.jpeg","6.9","Fate The Winx Saga"),
      movie("wwds.jpeg","8.5","What We Do in the Shadows"),
      movie("from.jpeg","7.7","From"),
      movie("mm.jpeg","7.4","Midnight Mass"),
      movie("thorder.jpeg","6.8","The Order"),
      movie("dreadful.jpeg","8.2","Penny Dreadful"),
      movie("vampac.jpeg","6.5","Vampire Academy"),
      movie("str.jpeg","7.3","The Strain"),
      movie("van.jpeg","6.9","Van Helsing"),
      movie("beinghuman.jpeg","7.8","Being Human"),
      movie("bloodties.jpeg","6.6","Blood Ties")
    ]
  }
];

function renderSections() {
  sections.forEach(section => {
    const container = document.getElementById(section.id);
    if (!container) return;

    container.innerHTML = "";

    section.movies.forEach(m => {
      const el = document.createElement("div");
      el.className = "movie-wrapper";
      el.innerHTML = `
        <a href="movieinfo.html?title=${encodeURIComponent(m.title)}">
          <div class="movie-card" style="background-image:url('${m.img}')"></div>
        </a>
        <div class="movie-info-bar">
          <div class="imdb-block">⭐ ${m.imdb}</div>
        </div>
      `;
      container.appendChild(el);
    });
  });
}
</script>
