<!-- ================= PAGE MODE SWITCH ================= -->
<script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");
const IS_DETAIL_PAGE = !!title;

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("movie-detail").style.display =
    IS_DETAIL_PAGE ? "block" : "none";

  document.getElementById("home-sections").style.display =
    IS_DETAIL_PAGE ? "none" : "block";

  if (!IS_DETAIL_PAGE) renderSections();
});
</script>

<!-- ================= HOME DATA (UNTOUCHED LISTS) ================= -->
<script>
function movie(img, imdb, title) {
  const src = (typeof assetUrl === "function") ? assetUrl(img) : img;
  return { img: src, imdb, title };
}

const sections = [
  {
    id: "section-main-stream",
    movies: [
      movie("assets/images/twlight.jpeg","5.2","Twilight"),
      movie("assets/images/leg.jpeg","7.3","Legacies"),
      movie("assets/images/vamp.jpeg","7.7","The Vampire Diaries"),
      movie("assets/images/originals.jpeg","8.2","The Originals")
    ]
  },
  {
    id: "section-trending",
    movies: [
      movie("assets/images/nos.jpeg","8.0","Nosferatu"),
      movie("assets/images/tala.jpeg","7.1","Thale"),
      movie("assets/images/drac.jpeg","7.4","Dracula"),
      movie("assets/images/priest.jpeg","5.7","Priest"),
      movie("assets/images/fromdusk.jpeg","7.2","From Dusk Till Dawn"),
      movie("assets/images/morb.jpeg","5.1","Morbius"),
      movie("assets/images/leg2.jpeg","7.3","Legacies"),
      movie("assets/images/teenw.jpeg","7.7","Teen Wolf"),

      movie("assets/images/zomb.jpeg","6.8","Zombies"),
      movie("assets/images/nightt.jpeg","7.6","Night Teeth"),
      movie("assets/images/luc.jpeg","8.2","Lucifer")
    ]
  },
  {
    id: "section-popular",
    movies: [
      movie("assets/images/dracdrac.jpeg","8.5","Dracula"),
      movie("assets/images/castl.jpeg","8.2","Castlevania"),
      movie("assets/images/hem.jpeg","7.1","Hemlock Grove"),
      movie("assets/images/tb.jpeg","7.9","True Blood"),
      movie("assets/images/sh.jpeg","6.7","Shadowhunters"),
      movie("assets/images/vh.jpeg","6.9","Van Helsing"),
      movie("assets/images/firsrtkill.jpeg","6.6","First Kill"),
      movie("assets/images/fate.jpeg","6.9","Fate The Winx Saga"),
      movie("assets/images/wwds.jpeg","8.5","What We Do in the Shadows"),
      movie("assets/images/from.jpeg","7.7","From"),
      movie("assets/images/mm.jpeg","7.4","Midnight Mass"),
      movie("assets/images/thorder.jpeg","6.8","The Order"),
      movie("assets/images/dreadful.jpeg","8.2","Penny Dreadful"),

      movie("assets/images/van.jpeg","6.9","Van Helsing"),
      movie("assets/images/beinghuman.jpeg","7.8","Being Human"),
      movie("assets/images/bloodties.jpeg","6.6","Blood Ties")
    ]
  }
];

function renderSections() {
  sections.forEach(section => {
    const container = document.getElementById(section.id);
    if (!container) return;

    container.innerHTML = "";

    section.movies.forEach(m => {
      const el = document.createElement("div");
      el.className = "movie-wrapper";
      el.innerHTML = `
        <a href="movieinfo.html?title=${encodeURIComponent(m.title)}">
          <div class="movie-card" style="background-image:url('${m.img}')"></div>
        </a>
        <div class="movie-info-bar">
          <div class="imdb-block">⭐ ${m.imdb}</div>
        </div>
      `;
      container.appendChild(el);
    });
  });
}
</script>
