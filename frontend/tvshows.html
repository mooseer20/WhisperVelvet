<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Shows | Velvet Whispers</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    font-family:'Cinzel',serif;
}

/* HERO */

.hero{
    min-height:60vh;
    display:flex;
    align-items:center;
    padding:80px;

    background:
    linear-gradient(
        rgba(0,0,0,.3),
        rgba(0,0,0,.95)
    ),
    radial-gradient(
        circle at center,
        rgba(255,0,42,.35),
        rgba(0,0,0,.9) 70%
    );
}

.hero-content{
    max-width:800px;
}

.hero-label{
    color:#ff002a;
    letter-spacing:4px;
    font-size:.9rem;
    font-weight:bold;
}

.hero-title{
    font-size:clamp(3rem,8vw,6rem);
    margin-top:15px;
}

.hero-subtitle{
    margin-top:20px;
    color:#d0d0d0;
    line-height:1.8;
}

.hero-meta{
    display:flex;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
    color:#999;
}

/* SECTION */

.section-header{
    max-width:1400px;
    margin:auto;
    padding:40px 30px 20px;
}

.section-title{
    font-size:2rem;
}

/* GRID */

.shows-row{
    max-width:1400px;
    margin:auto;

    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(250px,1fr));

    gap:30px;

    padding:0 30px 60px;
}

/* CARD */

.show-card{
    background:#0a0a0a;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;

    border:1px solid #1d1d1d;

    transition:
    transform .35s ease,
    box-shadow .35s ease;
}

.show-card:hover{
    transform:translateY(-8px);

    box-shadow:
    0 10px 30px rgba(255,0,42,.25);
}

.show-poster{
    width:100%;
    height:360px;
    background-size:cover;
    background-position:center;
}

.show-details{
    padding:20px;
    text-align:center;
}

.show-title{
    font-size:1.3rem;
}

.hover-info{
    opacity:0;
    max-height:0;

    overflow:hidden;

    transition:
    opacity .3s ease,
    max-height .3s ease;

    color:#ffccaa;
}

.show-card:hover .hover-info{
    opacity:1;
    max-height:300px;
    margin-top:12px;
}

.hover-info p{
    margin:8px 0;
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">

        <div class="hero-label">
            VELVET WHISPERS
        </div>

        <h1 class="hero-title">
            TV Shows
        </h1>

        <p class="hero-subtitle">
            Explore vampires, supernatural worlds,
            horror legends and dark fantasy stories.
        </p>

        <div class="hero-meta">
            <span>12 Titles</span>
            <span>•</span>
            <span>Drama</span>
            <span>•</span>
            <span>Fantasy</span>
            <span>•</span>
            <span>Horror</span>
        </div>

    </div>
</section>

<div class="section-header">
    <h2 class="section-title">
        Browse Collection
    </h2>
</div>

<div class="shows-row" id="shows-container"></div>

<script>

// Constructor
function show(img, imdb, seasons, episodes, genres, tagline) {
    return {
        img,
        imdb,
        seasons,
        episodes,
        genres,
        tagline
    };
}

// ALL 12 SHOWS

const tvShows = {

    tvd: show("assets/images/vamp.jpeg","7.7",8,171,
    ["Drama","Supernatural"],
    "A love triangle awakens a curse."),

    originals: show("assets/images/originals.jpeg","8.2",5,92,
    ["Horror","Drama"],
    "The first vampires fight."),

    legacies: show("assets/images/leg.jpeg","7.3",4,68,
    ["Fantasy","Teen"],
    "New supernatural heirs rise."),

    dreadful: show("assets/images/dreadful.jpeg","8.2",3,27,
    ["Dark Fantasy","Horror"],
    "Classic monsters woven into a gothic tale."),

    from: show("assets/images/from.jpeg","7.7",2,20,
    ["Horror","Mystery"],
    "A cursed town traps everyone who enters."),

    wwds: show("assets/images/wwds.jpeg","8.5",5,46,
    ["Comedy","Supernatural"],
    "Life gets messy when vampires are roommates."),

    blade: show("../BLADE.jpeg","7.1",3,30,
    ["Action","Horror"],
    "A half-vampire hunter protects humanity."),

    dracula: show("assets/images/drac.jpeg","6.5",1,10,
    ["Drama","Classic"],
    "The Prince of Darkness arrives in London."),

    underworld: show("assets/images/underwo.jpeg","7.0",5,5,
    ["Action","Thriller"],
    "The eternal war between vampires and lycans."),

    twilight: show("assets/images/twlight.jpeg","5.3",5,5,
    ["Romance","Fantasy"],
    "A teenage girl falls for a vampire."),

    interview: show("assets/images/int.jpeg","7.6",1,7,
    ["Drama","Horror"],
    "A vampire tells his life story to a reporter."),

    dusk: show("assets/images/dusk.jpeg","6.8",1,10,
    ["Action","Horror"],
    "A dark crime caper gone wrong.")
};

const titles = {
    tvd:"The Vampire Diaries",
    originals:"The Originals",
    legacies:"Legacies",
    dreadful:"Penny Dreadful",
    from:"From",
    wwds:"What We Do In The Shadows",
    blade:"Blade",
    dracula:"Dracula",
    underworld:"Underworld",
    twilight:"Twilight",
    interview:"Interview with the Vampire",
    dusk:"From Dusk Till Dawn"
};

// Render

document.addEventListener("DOMContentLoaded", () => {

    const container =
        document.getElementById("shows-container");

    Object.entries(tvShows).forEach(([id, show]) => {

        const card =
            document.createElement("div");

        card.className = "show-card";

        card.onclick = () => {
            window.location.href =
                `movieinfo.html?title=${encodeURIComponent(titles[id])}`;
        };

        card.innerHTML = `
            <div
                class="show-poster"
                style="background-image:url('${show.img}')">
            </div>

            <div class="show-details">

                <div class="show-title">
                    ${titles[id]}
                </div>

                <div class="hover-info">
                    <p>⭐ IMDb: ${show.imdb}</p>
                    <p>📺 ${show.seasons} Seasons</p>
                    <p>🎬 ${show.episodes} Episodes</p>
                    <p>${show.genres.join(" • ")}</p>
                    <p><em>${show.tagline}</em></p>
                </div>

            </div>
        `;

        container.appendChild(card);
    });

});

</script>

</body>
</html>
