<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Watching? - VelvetWhisp</title>
    <link rel="icon" type="image/png" href="assets/images/VW4.png">
    <link rel="stylesheet" href="css/whoiswatch.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="brand-logo">
        <a href="index.html" > VELVETWHISP </a>
        </div>
        <div class="container" >
        <h1 class="page-title" >WHO IS WATCHING?</h1>
        <div class="profiles-section static-profiles">
            <a href="#" class="profile-card">
                <div class="profile-avatar"> 
                    <img src="assets/images/prpic.jpeg" alt="Aegon">
                </div>
                <span class="profile-name">Aegon</span>
            </a>

            <a href="#" class="profile-card">
                <div class="profile-avatar">
                    <img src="assets/images/prpic2.jpeg" alt="Brian"> </div>
                <span class="profile-name">Brian</span>
            </a>
            <a href="#" class="profile-card">
                <div class="profile-avatar">
                    <img src="assets/images/prpic3.jpeg" alt="Jane"> </div>
                <span class="profile-name">Jane</span>
            </a>

            <a href="#" class="profile-card">
                <div class="profile-avatar"> 
                    <img src="assets/images/prpic4.jpeg" alt="Damon" >
                </div>
                <span class="profile-name">Damon</span>
            </a>
           
        </div>

        <div class="profiles-section dynamic-profiles">
            <div id="dynamic-profiles-grid" class="dynamic-profiles-grid">
                </div>

            <a href="addprof.html" class="profile-card add-profile-card">
                <div class="profile-avatar add-icon-wrapper">
                    <i class="fas fa-plus add-icon"></i>
                </div>
                <span class="profile-name">Add Profile</span>
            </a>
        </div>

        <div class="manage-profiles-section">
            <button class="manage-btn" onclick="window.location.href='mange.html'">
                MANAGE PROFILES
            </button>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/whoiswatch.js"></script>
</body>
</html>
