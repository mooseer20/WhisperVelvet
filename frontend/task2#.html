<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Grid Version</title>
<style>
body {
  background: #0d0d0d;
  color: #e3dede;
  font-family: 'Cinzel', serif;
  margin: 0;
}

.container {
  display: flex;
  max-width: 1400px;
  margin: 0 auto;
}

.sidebar {
  width: 220px;
  background: #1a1a1a;
  padding: 20px;
}

.main-content {
  flex: 1;
  padding: 30px;
  background: #1a1a1a;
}

.navbar ul {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
}

.navbar li {
  display: inline-block;
  margin: 0 10px;
}

.navbar a {
  text-decoration: none;
  color: #e3dede;
  padding: 10px 15px;
  display: inline-block;
}

.content-box {
  background: #111;
  padding: 20px;
  margin: 20px 0;
  border: 1px solid #330000;
  overflow: hidden;
}

.floated-image {
  float: left;
  width: 200px;
  margin-right: 15px;
  border: 2px solid #4d0000;
}
</style>
</head>
<body>
<div class="container">
  <aside class="sidebar">Sidebar (Flex)</aside>
  <main class="main-content">
    <nav class="navbar">
      <ul>
        <li><a href="#">News</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Artifacts</a></li>
      </ul>
    </nav>

    <div class="content-box">
      <img src="jasper.jpeg" alt="vampire" class="floated-image">
      <p>Without Grid: the image floats left and text wraps around it. Layout uses manual alignment and float behavior.</p>
    </div>
  </main>
</div>
</body>
</html>
